<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login BPP SMAN 2 Sampit</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#0f172a;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Arial;
}

.login-box{
    width:400px;
    background:white;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,0.2);
}

.logo{
    text-align:center;
    margin-bottom:20px;
}

.logo h2{
    color:#2563eb;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">
        <h2>SMART BPP</h2>
        <p>SMAN 2 Sampit</p>
    </div>

    <form method="POST" action="/login">

        <div class="mb-3">
            <label>Username</label>
            <input type="text" class="form-control" name="username">
        </div>

        <div class="mb-3">
            <label>Password</label>
            <input type="password" class="form-control" name="password">
        </div>

        <button class="btn btn-primary w-100">
            Login
        </button>

    </form>

</div>

</body>
</html>
