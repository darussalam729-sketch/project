<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login BPP SMAN 2 Sampit</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    overflow:hidden;
}

/* Background Blur Circle */

.circle1{
    position:absolute;
    width:300px;
    height:300px;
    background:rgba(255,255,255,0.1);
    border-radius:50%;
    top:-80px;
    left:-80px;
    filter:blur(10px);
}

.circle2{
    position:absolute;
    width:250px;
    height:250px;
    background:rgba(255,255,255,0.1);
    border-radius:50%;
    bottom:-80px;
    right:-80px;
    filter:blur(10px);
}

/* Login Box */

.login-container{
    position:relative;
    width:380px;
    padding:40px;
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.2);
    border-radius:25px;
    backdrop-filter:blur(15px);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    color:white;
    z-index:10;
}

.logo{
    width:90px;
    height:90px;
    margin:auto;
    margin-bottom:15px;
    border-radius:50%;
    background:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:35px;
    color:#2563eb;
    font-weight:bold;
}

.login-container h2{
    text-align:center;
    margin-bottom:5px;
    font-size:28px;
}

.login-container p{
    text-align:center;
    margin-bottom:30px;
    color:#dbeafe;
    font-size:14px;
}

/* Input */

.input-group{
    margin-bottom:20px;
}

.input-group label{
    display:block;
    margin-bottom:8px;
    font-size:14px;
}

.input-group input{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:rgba(255,255,255,0.15);
    color:white;
    outline:none;
    font-size:15px;
}

.input-group input::placeholder{
    color:#dbeafe;
}

/* Button */

.login-btn{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:white;
    color:#2563eb;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.login-btn:hover{
    background:#dbeafe;
    transform:translateY(-2px);
}

/* Footer */

.footer{
    margin-top:20px;
    text-align:center;
    font-size:12px;
    color:#dbeafe;
}

</style>
</head>

<body>

<div class="circle1"></div>
<div class="circle2"></div>

<div class="login-container">

    <div class="logo">
        S2
    </div>

    <h2>SMART BPP</h2>
    <p>SMAN 2 Sampit</p>

    <form action="dashboard.html">

        <div class="input-group">
            <label>Username</label>
            <input type="text" placeholder="Masukkan username" required>
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" placeholder="Masukkan password" required>
        </div>

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="footer">
        © 2026 SMART BPP SMAN 2 Sampit
    </div>

</div>

</body>
</html>
